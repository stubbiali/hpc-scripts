spack:
  specs:
#    - gcc@13.4.0
    - boost@1.88
#    - cmake@3.31.8 %gcc@13.4.0
#    - cray-mpich@8.1.32 +cuda %gcc@13.4.0
#    - cuda@12.9.0
    - netcdf-c@4.9.3 +mpi
    - python@3.11.11
#    - py-mpi4py@4.0.1 %gcc@13.4.0
#    - py-ghex@0.4.1 +cuda
#    - py-netcdf4@1.7.2 +mpi %gcc@13.4.0
  view: false
  concretizer:
    reuse: true
    unify: when_possible
  upstreams:
    pmap:
      install_tree: /capstor/scratch/cscs/ciextc28/software_stack/spack/opt/spack/
  repos:
    software:
      /capstor/scratch/cscs/ciextc28/software_stack/spack_repo/software
    alps:
      /capstor/scratch/cscs/ciextc28/software_stack/spack_repo/cluster/alps/
    builtin:
      commit: f2db2dec4857d36749cdb368c5b0583503081509
  packages:
    mpi:
      require: cray-mpich
    # Cluster config from here: https://github.com/eth-cscs/alps-cluster-config/blob/master/todi/packages.yaml
    # patchelf v0.18 leads to errors when it was used to set RPATHS
    #   ELF load command address/offset not properly aligned
    # c.f.  https://github.com/NixOS/patchelf/issues/492
    cray-gtl:
      buildable: true
    cray-mpich:
      buildable: true
    cray-pals:
      buildable: true
    cray-pmi:
      buildable: true
    patchelf:
      require: "@:0.17"
    libfabric:
      buildable: false
      externals:
      - spec: libfabric@1.15.2.0
        prefix: /opt/cray/libfabric/1.15.2.0/
    slurm:
      buildable: false
      externals:
      - spec: slurm@23-02-6
        prefix: /usr
    egl:
      buildable: false
      externals:
      - spec: egl@1.5
        prefix: /usr
    xpmem:
      buildable: false
      externals:
      - spec: xpmem@2.9.6
        prefix: /usr
