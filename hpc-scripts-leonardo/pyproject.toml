[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=65.5.0', 'wheel']

[project]
authors = [
    {name = 'Stefano Ubbiali', email = 'subbiali@phys.ethz.ch'},
]
dependencies = [
    'hpc_scripts_common @ git+https://github.com/stubbiali/hpc-scripts.git@namespaces#subdirectory=hpc-scripts-common'
]
description = 'Scripts for Leonardo @ Cineca'
name = 'hpc_scripts_leonardo'
version = '0.0'

[project.scripts]
make_prepare_pmap = 'hpc_scripts.leonardo.make_prepare_pmap:main'
make_run_pmap = 'hpc_scripts.leonardo.make_run_pmap:main'
make_select_gpu = 'hpc_scripts.leonardo.make_select_gpu:main'
sbatch_pmap = 'hpc_scripts.leonardo.sbatch_pmap:main'
pysalloc = 'hpc_scripts.leonardo.salloc:main'

[tool.setuptools.packages.find]
where = ["src/"]
include = ["hpc_scripts.leonardo"]
namespaces = true
